name: Release desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential cmake clang libclang-dev curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build unsigned desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
      - name: Collect installer assets
        shell: bash
        run: |
          mkdir -p release
          version="$(node -p "require('./package.json').version")"
          while IFS= read -r -d '' source; do
            case "$source" in
              *.AppImage) extension="AppImage" ;;
              *) extension="${source##*.}" ;;
            esac
            cp "$source" "release/private-call-captions-${version}-${{ matrix.name }}.${extension}"
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
      - name: Test Windows checksum installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'pcc-installer-test'
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $asset = Get-ChildItem 'release/*-windows.msi' | Select-Object -First 1
          Copy-Item $asset.FullName $fixture
          $name = $asset.Name
          $hash = (Get-FileHash (Join-Path $fixture $name) -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding ascii (Join-Path $fixture 'SHA256SUMS')
          @{ platforms = @{ windows = @{ file = $name; url = "https://example.invalid/$name" } } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $fixture 'latest.json')
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$fixture -PassThru
          try {
            Start-Sleep -Seconds 1
            $env:PCC_RELEASE_BASE = 'http://127.0.0.1:8765'
            $env:PCC_ASSET_BASE = 'http://127.0.0.1:8765'
            $env:PCC_INSTALLER_NO_OPEN = '1'
            ./public/install.ps1
          } finally { Stop-Process -Id $server.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error
  release:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Build checksums and download manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/create-release-metadata.mjs release "$TAG" "$REPO"
      - name: Test Linux checksum installer
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory release >/tmp/pcc-release-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          install_dir="$(mktemp -d)"
          PCC_RELEASE_BASE=http://127.0.0.1:8765 PCC_ASSET_BASE=http://127.0.0.1:8765 PCC_INSTALL_DIR="$install_dir" sh public/install.sh
          test -x "$install_dir/private-call-captions"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
