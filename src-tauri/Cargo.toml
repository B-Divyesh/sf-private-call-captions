[package]
name = "private-call-captions"
version = "0.1.4"
description = "Local microphone-only captions"
authors = ["Param Factory"]
edition = "2021"

[lib]
name = "private_call_captions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
whisper-rs = "0.12"
serde = { version = "1", features = ["derive"] }
